<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Предторговый тест</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--fg:#1b2430;--muted:#5d6b7a;--line:#d5dce3;--accent:#1f6f78;--on:#fff;--red:#b3261e;--amber:#9a6200;--green:#2a7a4b;--tint-red:#fbe9e7;--tint-amber:#fdf1d8;--tint-green:#e3f3ea;--orange:#b34a00;--tint-orange:#fde8d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161c;--card:#1a2129;--fg:#e6ebf0;--muted:#97a4b1;--line:#2c3742;--accent:#5fb4bd;--on:#08171a;--red:#ff8a80;--amber:#f2c164;--green:#73c995;--tint-red:#3a1f1d;--tint-amber:#392d14;--tint-green:#173326;--orange:#ffa366;--tint-orange:#3a2415;color-scheme:dark}}
:root[data-theme="dark"]{--orange:#ffa366;--tint-orange:#3a2415;--bg:#11161c;--card:#1a2129;--fg:#e6ebf0;--muted:#97a4b1;--line:#2c3742;--accent:#5fb4bd;--on:#08171a;--red:#ff8a80;--amber:#f2c164;--green:#73c995;--tint-red:#3a1f1d;--tint-amber:#392d14;--tint-green:#173326;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:0 0 6px}h2{font-size:20px;margin:0 0 4px}
p{margin:0 0 14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;color:var(--fg);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:52px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.main{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:600;width:100%}
button.opt{flex:1 1 40%}
.nums{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.nums button{padding:0;font-size:20px;font-weight:600;min-height:56px}
.nums button.sel{background:var(--accent);color:var(--on);border-color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:8px}
.link{background:none;border:0;color:var(--muted);min-height:44px;padding:10px 4px;text-decoration:underline}
.verdict{border-radius:14px;padding:22px 18px;margin-bottom:14px;border:2px solid}
.verdict h1{font-size:30px;margin-bottom:8px}.verdict p{color:inherit;margin:0}
.v-red{background:var(--tint-red);color:var(--red);border-color:var(--red)}
.v-amber{background:var(--tint-amber);color:var(--amber);border-color:var(--amber)}
.v-green{background:var(--tint-green);color:var(--green);border-color:var(--green)}.v-yellow{background:var(--tint-amber);color:var(--amber);border-color:var(--amber)}.v-orange{background:var(--tint-orange);color:var(--orange);border-color:var(--orange)}
ul{margin:0;padding-left:20px}li{margin-bottom:6px}
.h{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.h:last-child{border:0}.h small{color:var(--muted);display:block}
.tag{font-weight:700;white-space:nowrap}.tag.red{color:var(--red)}.tag.amber,.tag.yellow{color:var(--amber)}.tag.orange{color:var(--orange)}.tag.green{color:var(--green)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var PEOPLE=["Влад О","Влад П"];
var DISC=["Пропсчёт","Биржа","Orbit","Win","PS","Криптобиржа"];
var Q=[
{k:"revenge",t:"Желание отыграться",q:"Насколько сильно ты сейчас хочешь отыграться?",s:function(x){return x>6}},
{k:"problems",t:"Проблемы дома / на работе / в жизни",q:"Насколько сильно текущие проблемы мешают тебе сосредоточиться?",s:function(x){return x>=6}},
{k:"irritation",t:"Раздражение обычными вещами",q:"Насколько ты сейчас раздражён обычными вещами?",s:function(x){return x>=6}},
{k:"confusion",t:"Ощущение, что ничего не понимаешь",q:"Насколько сильно сейчас есть ощущение, что ты ничего не понимаешь?",s:function(){return false}},
{k:"bad_mood",t:"Плохое настроение",q:"Насколько плохое у тебя сейчас настроение?",s:function(x){return x>=6}},
{k:"fatigue",t:"Усталость",q:"Насколько сильно ты сейчас устал?",s:function(x){return x>=7}},
{k:"euphoria",t:"Эйфория от побед",q:"Степень эйфории от побед",s:function(){return false}},
{k:"sleep",t:"Сон / недосып",q:"Насколько сильно тебе сейчас не хватает сна?",s:function(x){return x>=6}},
{k:"rule_breaking",t:"Желание нарушить собственные правила",q:"Насколько сильно сейчас хочется нарушить свои торговые правила?",s:function(x){return x>=5}},
{k:"health",t:"Здоровье",q:"Проблемы со здоровьем",s:function(x){return x>=6}}
];
var MAX=Q.length*10+1, KEY="pretrade_results";
var st={step:"home"},app=document.getElementById("app");

function load(){try{var r=JSON.parse(localStorage.getItem(KEY));return Array.isArray(r)?r:[]}catch(e){return []}}
function save(list){try{localStorage.setItem(KEY,JSON.stringify(list));return true}catch(e){return false}}
function when(d){return new Intl.DateTimeFormat("ru-RU",{timeZone:"Asia/Bangkok",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false}).format(d).replace(", "," в ")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(iso){var d=new Date(iso);return d.toLocaleDateString("ru-RU")+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}

function evaluate(a,alc){
  var stops=[],sum=0;
  Q.forEach(function(q){var v=a[q.k];sum+=v;if(q.s(v))stops.push(q.t+": "+v)});
  if(alc)stops.push("Алкоголь");
  var score=sum+(alc?1:0),level;
  var vol;
  if(stops.length){level="red";vol="Торговля запрещена."}
  else if(score<=27){level="green";vol=a.euphoria>5?"Половина объёма":"Полный объём"}
  else if(score<=35){level="yellow";vol="Половина объёма"}
  else if(score<=40){level="orange";vol="Одна треть объёма"}
  else{level="red";vol="Торговля запрещена."}
  return{score:score,stops:stops,level:level,volume:vol,granted:level!=="red"};
}
var LBL={red:"Допуск не получен",yellow:"Допуск получен",orange:"Допуск получен",green:"Допуск получен"};
var ICON={green:"🟢",yellow:"🟡",orange:"🟠",red:"🔴"};

function go(s){for(var k in s)st[k]=s[k];render()}
function render(){
  var h="";
  if(st.step==="home"){
    h='<h1>Предторговый тест</h1><p>Отвечай честно. После теста приложение рассчитает уровень допуска.</p>'+
      '<button class="main" data-a="start">Начать тест</button><div style="height:10px"></div>'+
      '<button class="link" data-a="hist">История ('+load().length+')</button>';
  }else if(st.step==="person"){
    h='<h2>Ты Влад О или Влад П?</h2><p>&nbsp;</p><div class="row">'+PEOPLE.map(function(p,i){return'<button class="opt" data-a="person" data-i="'+i+'">'+esc(p)+'</button>'}).join("")+'</div>';
  }else if(st.step==="disc"){
    h='<h2>Для какой дисциплины вам допуск?</h2><p>&nbsp;</p><div class="row">'+DISC.map(function(p,i){return'<button class="opt" data-a="disc" data-i="'+i+'">'+esc(p)+'</button>'}).join("")+'</div>';
  }else if(st.step==="q"){
    var q=Q[st.i],cur=st.ans[q.k],n="";
    for(var i=0;i<=10;i++)n+='<button class="'+(cur===i?"sel":"")+'" data-a="score" data-v="'+i+'">'+i+'</button>';
    h='<div class="bar"><i style="width:'+(st.i/(Q.length+1)*100)+'%"></i></div>'+
      '<div class="card"><p style="margin:0 0 6px;font-size:14px">Вопрос '+(st.i+1)+' из '+Q.length+'</p><h2>'+esc(q.t)+'</h2><p>'+esc(q.q)+'</p><div class="nums">'+n+'</div>'+
      '<div class="scale"><span>0: совсем нет</span><span>10: максимально</span></div></div>'+
      '<button class="link" data-a="back">Назад</button>';
  }else if(st.step==="alc"){
    h='<div class="bar"><i style="width:'+(Q.length/(Q.length+1)*100)+'%"></i></div><div class="card"><h2>Алкоголь</h2><p>Есть ли сейчас алкоголь в организме? Даже небольшое количество — автоматический запрет на торговлю.</p>'+
      '<div class="row"><button class="opt" data-a="alc" data-v="0">Нет</button><button class="opt" data-a="alc" data-v="1">Да</button></div></div>'+
      '<button class="link" data-a="back">Назад</button>';
  }else if(st.step==="result"){
    var r=st.res;
    h='<div class="verdict v-'+r.level+'"><h1>'+ICON[r.level]+' '+LBL[r.level]+'</h1><p>Объём: '+esc(r.volume)+'</p></div>'+
      '<div class="card"><h2>Баллы: '+r.score+' из '+MAX+'</h2><p>'+esc(st.person)+', '+esc(st.disc)+'</p><p>'+(r.granted?'Допуск получен: ':'Тест завершён: ')+esc(r.when)+'</p>'+
      (r.stops.length?'<ul>'+r.stops.map(function(s){return'<li>'+esc(s)+'</li>'}).join("")+'</ul>':'<p style="margin:0">Стоп-факторов нет.</p>')+'</div>'+'<div class="card"><h2>Ответы</h2><ul>'+Q.map(function(q){return'<li>'+esc(q.q)+': '+st.ans[q.k]+' / 10</li>'}).join("")+'<li>Есть ли сейчас алкоголь в организме? '+(st.alc?"Да":"Нет")+'</li></ul></div><p>Правило: любой стоп-фактор отменяет допуск независимо от суммы баллов.</p>'+
      '<button class="main" data-a="start">Новый тест</button><div style="height:10px"></div><button class="link" data-a="hist">История</button>';
  }else if(st.step==="hist"){
    var L=load().slice().reverse();
    h='<div class="top"><h2>История</h2><button class="link" data-a="home">Закрыть</button></div>'+
      (L.length?'<div class="card">'+L.map(function(r){return'<div class="h"><div>'+esc(r.person)+', '+esc(r.discipline)+'<small>'+fmt(r.completed_at||r.date)+', '+(r.total_score!=null?r.total_score:r.score)+' из '+MAX+(r.allowed_volume?', '+esc(r.allowed_volume):'')+'</small></div><span class="tag '+r.level+'">'+(LBL[r.level]||'')+'</span></div>'}).join("")+'</div>'+
      '<div class="row"><button class="opt" data-a="copy">Скопировать данные</button><button class="opt" data-a="clear">Очистить</button></div><p id="msg" style="margin-top:10px"></p>':
      '<p>Пока нет результатов. Пройди первый тест.</p><button class="main" data-a="start">Начать тест</button>');
  }
  app.innerHTML=h;window.scrollTo(0,0);
}

app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var a=b.dataset.a,v=b.dataset.v,i=b.dataset.i;
  if(a==="start")go({step:"person",ans:{},i:0,alc:null});
  else if(a==="home")go({step:"home"});
  else if(a==="hist")go({step:"hist"});
  else if(a==="person")go({step:"disc",person:PEOPLE[i]});
  else if(a==="disc")go({step:"q",disc:DISC[i],i:0});
  else if(a==="score"){st.ans[Q[st.i].k]=+v;if(st.i+1<Q.length)go({i:st.i+1});else go({step:"alc"})}
  else if(a==="back"){if(st.step==="alc")go({step:"q",i:Q.length-1});else if(st.i>0)go({i:st.i-1});else go({step:"disc"})}
  else if(a==="alc"){
    var res=evaluate(st.ans,v==="1"),L=load(),now=new Date();res.when=when(now);st.alc=v==="1";
    L.push({completed_at:now.toISOString(),completed_label:res.when,person:st.person,discipline:st.disc,answers:Object.assign({},st.ans,{alcohol:v==="1"?"Yes":"No"}),total_score:res.score,access_granted:res.granted,allowed_volume:res.volume,stop_factors:res.stops,level:res.level});
    save(L);go({step:"result",res:res});
  }
  else if(a==="copy"){
    var t=JSON.stringify(load(),null,2),m=function(s){var x=document.getElementById("msg");if(x)x.textContent=s};
    try{navigator.clipboard.writeText(t).then(function(){m("Данные скопированы.")},function(){m("Не удалось скопировать.")})}catch(err){m("Не удалось скопировать.")}
  }
  else if(a==="clear"){if(confirm("Удалить всю историю?")){save([]);render()}}
});
render();
</script>
</body>
</html>
